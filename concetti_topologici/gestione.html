<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F5FF">
    <meta name="description" content="Concetti topologici - Configurazione: scene, impostazioni e risultati">

    <title>Configurazione - Concetti topologici</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="css/styles.css?v=20261124-logo">
    <script src="js/raccolta.js?v=1.1"></script>
    <!-- Installazione sul dispositivo: barra in basso ben visibile (js/installa.js) -->
    <script src="js/installa.js?v=2.1" data-nome="Concetti topologici" data-colore="#3D3BFF"></script>
</head>
<body class="avvio">

    <header class="avvio-testata">
        <img class="logo-lega" src="assets/img/logo-lega-filo-oro.png" alt="Lega del Filo d'Oro">
        <!-- La pagina iniziale si apre con ?menu=1: senza, l'app andrebbe da sola all'esercizio -->
        <nav class="ct-frecce" aria-label="Navigazione">
            <a class="ct-freccia" href="index.html?menu=1" title="Pagina iniziale di Concetti topologici" aria-label="Pagina iniziale di Concetti topologici"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
        </nav>
        <a class="avvio-marchio" href="index.html?menu=1" title="Torna alla scelta dell'area">
            <span class="ct-logo" aria-hidden="true"></span>
            <span><h1>Concetti topologici</h1><small>Configurazione</small></span>
        </a>
        <div class="avvio-utente">
            <a class="btn btn-piccolo" href="index.html?menu=1">Pagina iniziale</a>
            <button type="button" class="ct-freccia ct-aggiorna" data-aggiorna-app title="Aggiorna l'app (i dati restano)" aria-label="Aggiorna l'app"></button>
        </div>
    </header>

    <main class="avvio-corpo">
        <div class="barra-utente barra-azioni">
            <div class="azioni">
                <span class="stato-salvataggio" id="statoSalvataggio" aria-live="polite"></span>
                <a class="btn" id="btnProva" href="#"></a>
                <a class="btn btn-primario" id="btnUtente" href="#"></a>
            </div>
        </div>

        <div class="schede" role="tablist">
            <button type="button" class="scheda" role="tab" data-scheda="scene" aria-selected="true"></button>
            <button type="button" class="scheda" role="tab" data-scheda="impostazioni" aria-selected="false"></button>
            <button type="button" class="scheda" role="tab" data-scheda="risultati" aria-selected="false"></button>
        </div>

        <section id="pannello" aria-live="polite">
            <div class="vuoto-stato">Caricamento…</div>
        </section>
    </main>

    <footer class="pie">
        <span>Pittogrammi <a href="https://arasaac.org" target="_blank" rel="noopener">ARASAAC</a> (CC BY-NC-SA, autore Sergio Palao, Governo di Aragona)</span>
    </footer>

    <div id="toast" class="toast-contenitore" aria-live="polite"></div>

    <script src="js/comune.js?v=1.1.7"></script>
    <script src="js/concetti.js?v=1.1.7"></script>
    <script src="js/archivio.js?v=1.1.7"></script>
    <script src="js/gestione.js?v=1.1.7"></script>
