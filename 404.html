<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#673AB7">
    <title>Pagina non trovata - Web App AssistiveTech</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f1f8;
            color: #263238;
            padding: 1rem;
            box-sizing: border-box;
        }

        main {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            padding: 2rem 1.5rem;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            color: #673AB7;
            font-size: 1.5rem;
            margin: 0 0 0.6rem;
        }

        p {
            margin: 0 0 1.4rem;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 0.7rem 1.4rem;
            border-radius: 25px;
            background: linear-gradient(135deg, #673AB7, #9C27B0);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Pagina non trovata</h1>
        <p>L'indirizzo non corrisponde a nessuna app. Forse l'app è stata spostata o il link è incompleto.</p>
        <a href="/">Tutte le Web App</a>
    </main>
</body>
</html>
