<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#673AB7">
    <meta name="description" content="Web app della Lega del Filo d'Oro">
    <title>Web app - Lega del Filo d'Oro</title>
    <!--
        INDICE DELLA RACCOLTA (repository GitHub → Azure Static Web Apps)
        Ogni app sta in una sottocartella del repository.
        Per aggiungere un'app: aggiungere una voce all'elenco APP qui sotto
        (una riga «cartella: '...'» e il nome), poi lanciare  bash aggiorna.sh :
        copia la cartella da ~/PROGETTTI_SINGOLI_AZURE/webapp e rigenera
        staticwebapp.config.json. Questo elenco è l'unica lista delle app.
    -->
    <style>
        :root {
            --viola: #673AB7;
            --magenta: #9C27B0;
            --sfondo: #f4f1f8;
            --box: #ffffff;
            --testo: #263238;
            --tenue: #6b6478;
            --bordo: #e7e0f2;
            --ombra: 0 4px 14px rgba(60, 30, 110, 0.08);
            --ombra-su: 0 12px 26px rgba(103, 58, 183, 0.22);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --sfondo: #17131f;
                --box: #231d2e;
                --testo: #ece8f3;
                --tenue: #a69fb3;
                --bordo: #362c46;
                --ombra: 0 4px 14px rgba(0, 0, 0, 0.35);
                --ombra-su: 0 12px 26px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            background: var(--sfondo);
            color: var(--testo);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--viola), var(--magenta));
            color: #fff;
            text-align: center;
            padding: calc(2.2rem + env(safe-area-inset-top)) 1rem 3.2rem;
        }

        header h1 {
            font-size: clamp(1.7rem, 5vw, 2.4rem);
            letter-spacing: 0.01em;
        }

        header p {
            margin-top: 0.4rem;
            opacity: 0.9;
            font-size: 1.05rem;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: -1.8rem auto 2.5rem;
            padding: 0 16px;
        }

        .elenco {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 250px));
            justify-content: center;
            gap: 1.1rem;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            height: 100%;
            padding: 1.6rem 1rem 1.3rem;
            background: var(--box);
            border: 1px solid var(--bordo);
            border-radius: 20px;
            box-shadow: var(--ombra);
            color: inherit;
            text-decoration: none;
            text-align: center;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .app:hover,
        .app:focus-visible {
            transform: translateY(-4px);
            box-shadow: var(--ombra-su);
            border-color: var(--viola);
        }

        .app:focus-visible {
            outline: 3px solid var(--magenta);
            outline-offset: 3px;
        }

        .icona {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            overflow: hidden;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--viola), var(--magenta));
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .icona img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .nome {
            font-size: 1.15rem;
            font-weight: 650;
            line-height: 1.3;
        }

        .apri {
            margin-top: auto;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--viola);
        }

        @media (prefers-color-scheme: dark) {
            .apri {
                color: #c3a6f0;
            }
        }

        footer {
            text-align: center;
            font-size: 0.82rem;
            color: var(--tenue);
            padding: 0 16px calc(1.8rem + env(safe-area-inset-bottom));
        }
    </style>
</head>
<body>
    <header>
        <h1>Web app Lega del Filo d'Oro</h1>
        <p>Scegli un'app per aprirla</p>
    </header>

    <main>
        <ul class="elenco" id="elencoApp"></ul>
    </main>

    <footer>
        I dati di ogni app restano su questo dispositivo · Pittogrammi ARASAAC (Sergio Palao, Governo di Aragona), CC BY-NC-SA · Simboli Mulberry (Steve Lee), CC BY-SA
    </footer>

    <script>
        // ==================== ELENCO DELLE APP ====================
        // cartella: nome della sottocartella del repository (uguale a quella in ~/PROGETTTI_SINGOLI_AZURE/webapp)
        // nome: quello che si legge nel box
        // icona (facoltativa): percorso dell'icona dentro la cartella dell'app
        // Scrivere ogni voce su una riga «cartella: '...'»: aggiorna.sh legge l'elenco da qui.
        const APP = [
            { cartella: 'conta_con_le_dita', nome: 'Conta con le dita' },
            { cartella: 'scrivo_parole', nome: 'Scrivo parole con le lettere/sillabe' },
            { cartella: 'frase_minima', nome: 'Frase minima' },
            { cartella: 'concetti_topologici', nome: 'Concetti topologici' },
            { cartella: 'scrittura_simboli', nome: 'Scrittura con Simboli' },
        ];

        const ICONA_PREDEFINITA = 'assets/icons/icon-192.png';

        const elenco = document.getElementById('elencoApp');
        for (const app of APP) {
            const voce = document.createElement('li');
            const link = document.createElement('a');
            link.className = 'app';
            link.href = `${app.cartella}/`;

            const icona = document.createElement('span');
            icona.className = 'icona';
            icona.setAttribute('aria-hidden', 'true');
            const img = document.createElement('img');
            img.alt = '';
            img.src = `${app.cartella}/${app.icona || ICONA_PREDEFINITA}`;
            img.onerror = () => {   // senza icona: l'iniziale del nome
                img.remove();
                icona.textContent = app.nome.charAt(0).toUpperCase();
            };
            icona.appendChild(img);

            const nome = document.createElement('span');
            nome.className = 'nome';
            nome.textContent = app.nome;

            const apri = document.createElement('span');
            apri.className = 'apri';
            apri.setAttribute('aria-hidden', 'true');
            apri.textContent = 'Apri →';

            link.append(icona, nome, apri);
            voce.appendChild(link);
            elenco.appendChild(voce);
        }
    </script>
</body>
</html>
