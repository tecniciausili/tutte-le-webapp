<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Web app della Lega del Filo d'Oro">
    <title>Web app - Lega del Filo d'Oro</title>
    <!--
        INDICE DELLA RACCOLTA (repository GitHub → Azure Static Web Apps)
        Ogni app sta in una sottocartella del repository.
        Per aggiungere un'app: mettere la sua cartella nel repository, aggiungere una voce
        all'elenco APP qui sotto (una riga «cartella: '...'» e il nome), poi lanciare
        bash controlla.sh : rigenera staticwebapp.config.json. Questo elenco è l'unica lista
        delle app.
    -->
    <style>
        :root {
            --viola: #673AB7;
            --magenta: #9C27B0;
            --sfondo: #f4f1f8;
            --box: #ffffff;
            --testo: #263238;
            --tenue: #6b6478;
            --bordo: #e7e0f2;
            --ombra: 0 4px 14px rgba(60, 30, 110, 0.08);
            --ombra-su: 0 12px 26px rgba(103, 58, 183, 0.22);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --sfondo: #17131f;
                --box: #231d2e;
                --testo: #ece8f3;
                --tenue: #a69fb3;
                --bordo: #362c46;
                --ombra: 0 4px 14px rgba(0, 0, 0, 0.35);
                --ombra-su: 0 12px 26px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            background: var(--sfondo);
            color: var(--testo);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Intestazione bianca con il logo della Lega del Filo d'Oro a sinistra (come nelle app) */
        header {
            background: #fff;
            color: var(--viola);
            box-shadow: 0 1px 0 #e3e8e7, 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: calc(0.8rem + env(safe-area-inset-top)) 16px 0.8rem;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1rem;
        }

        .logo-lega {
            display: block;
            height: 69px;
            width: auto;
        }

        .titolo {
            text-align: center;
        }

        header h1 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            letter-spacing: 0.01em;
        }

        header p {
            margin-top: 0.2rem;
            color: var(--tenue);
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .logo-lega {
                height: 55px;
            }
        }

        /* Telefono: logo sopra, titolo sotto */
        @media (max-width: 560px) {
            header {
                grid-template-columns: 1fr;
                justify-items: center;
                gap: 0.5rem;
            }
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 1.8rem auto 2.5rem;
            padding: 0 16px;
        }

        .elenco {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 250px));
            justify-content: center;
            gap: 1.1rem;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            height: 100%;
            padding: 1.6rem 1rem 1.3rem;
            background: var(--box);
            border: 1px solid var(--bordo);
            border-radius: 20px;
            box-shadow: var(--ombra);
            color: inherit;
            text-decoration: none;
            text-align: center;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .app:hover,
        .app:focus-visible {
            transform: translateY(-4px);
            box-shadow: var(--ombra-su);
            border-color: var(--viola);
        }

        .app:focus-visible {
            outline: 3px solid var(--magenta);
            outline-offset: 3px;
        }

        .icona {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            overflow: hidden;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--viola), var(--magenta));
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .icona img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .nome {
            font-size: 1.15rem;
            font-weight: 650;
            line-height: 1.3;
        }

        .dettaglio {
            font-size: 0.82rem;
            color: var(--tenue);
            margin-top: -0.4rem;
        }

        .dettaglio:empty {
            display: none;
        }

        .apri {
            margin-top: auto;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--viola);
        }

        @media (prefers-color-scheme: dark) {
            .apri {
                color: #c3a6f0;
            }
        }

        footer {
            text-align: center;
            font-size: 0.82rem;
            color: var(--tenue);
            padding: 0 16px calc(1.8rem + env(safe-area-inset-bottom));
        }
    </style>
</head>
<body>
    <header>
        <img class="logo-lega" src="logo-lega-filo-oro.png" alt="Lega del Filo d'Oro">
        <div class="titolo">
            <h1>Web app Lega del Filo d'Oro</h1>
            <p>Scegli un'app per aprirla</p>
        </div>
    </header>

    <main>
        <ul class="elenco" id="elencoApp"></ul>
    </main>

    <footer>
        I dati di ogni app restano su questo dispositivo · Pittogrammi ARASAAC (Sergio Palao, Governo di Aragona), CC BY-NC-SA · Simboli Mulberry (Steve Lee), CC BY-SA
    </footer>

    <script>
        // ==================== ELENCO DELLE APP ====================
        // cartella: nome della sottocartella del repository
        // nome: quello che si legge nel box
        // icona (facoltativa): percorso dell'icona dentro la cartella dell'app
        // apk (facoltativo): il box scarica questo file Android invece di aprire una pagina
        //   (nella cartella c'è anche versione.json con versione, data e byte dell'APK)
        // url (al posto di cartella): il box scarica da un indirizzo esterno, per esempio
        //   l'installatore Windows pubblicato come Release su GitHub (troppo grande per il sito);
        //   icona è allora il percorso dalla radice, sistema e dettaglio il testo del box
        // Scrivere ogni voce su una riga «cartella: '...'»: controlla.sh legge l'elenco da qui.
        const APP = [
            { cartella: 'conta_con_le_dita', nome: 'Conta con le dita' },
            { cartella: 'scrivo_parole', nome: 'Scrivo parole con le lettere/sillabe' },
            { cartella: 'frase_minima', nome: 'Frase minima' },
            { cartella: 'concetti_topologici', nome: 'Concetti topologici' },
            { cartella: 'scrittura_simboli', nome: 'Scrittura con Simboli' },
            { cartella: 'parola_immagine', nome: 'Parola-Immagine' },
            { cartella: 'causa-effetto', nome: 'Causa Effetto' },
            { cartella: 'apprendere_categorie', nome: 'Apprendere Categorie' },
            { cartella: 'mastertutor', nome: 'Mastertutor' },
            { cartella: 'trova-forma', nome: 'Trova Forma', icona: 'icons/icon-192.png' },
            { cartella: 'mastertutor-android', nome: 'Mastertutor Android', icona: '../mastertutor/assets/icons/icon-192.png', apk: 'Mastertutor.apk' },
            { nome: 'Mastertutor Windows', url: 'https://github.com/tecniciausili/mastertutor/releases/download/windows-1.0.22/Mastertutor-Setup-1.0.22.exe', icona: 'mastertutor/assets/icons/icon-192.png', sistema: 'Windows', dettaglio: 'Versione 1.0.22 · installatore da 109 MB' },
        ];

        const ICONA_PREDEFINITA = 'assets/icons/icon-192.png';

        // App Android: versione, data e dimensione dell'APK (file versione.json nella sua cartella)
        async function infoApk(app, dettaglio) {
            try {
                const r = await fetch(`${app.cartella}/versione.json`, { cache: 'no-cache' });
                const v = await r.json();
                const mb = (v.byte / (1024 * 1024)).toFixed(1).replace('.', ',');
                dettaglio.textContent = `Versione ${v.versione} del ${v.data} · ${mb} MB`;
            } catch (e) { /* senza versione.json il box resta valido */ }
        }

        const elenco = document.getElementById('elencoApp');
        for (const app of APP) {
            const voce = document.createElement('li');
            const link = document.createElement('a');
            link.className = 'app';
            link.href = app.url || (app.apk ? `${app.cartella}/${app.apk}` : `${app.cartella}/`);
            if (app.apk) link.setAttribute('download', app.apk);

            const icona = document.createElement('span');
            icona.className = 'icona';
            icona.setAttribute('aria-hidden', 'true');
            const img = document.createElement('img');
            img.alt = '';
            img.src = app.cartella ? `${app.cartella}/${app.icona || ICONA_PREDEFINITA}` : app.icona;
            img.onerror = () => {   // senza icona: l'iniziale del nome
                img.remove();
                icona.textContent = app.nome.charAt(0).toUpperCase();
            };
            icona.appendChild(img);

            const nome = document.createElement('span');
            nome.className = 'nome';
            nome.textContent = app.nome;

            const dettaglio = document.createElement('span');
            dettaglio.className = 'dettaglio';
            if (app.dettaglio) dettaglio.textContent = app.dettaglio;

            const apri = document.createElement('span');
            apri.className = 'apri';
            apri.setAttribute('aria-hidden', 'true');
            const sistema = app.apk ? 'Android' : app.sistema;
            apri.textContent = sistema ? `Scarica per ${sistema} ↓` : 'Apri →';
            link.setAttribute('aria-label', sistema ? `Scarica ${app.nome} per ${sistema}` : `Apri ${app.nome}`);

            link.append(icona, nome, dettaglio, apri);
            voce.appendChild(link);
            elenco.appendChild(voce);
            if (app.apk) infoApk(app, dettaglio);
        }
    </script>
</body>
</html>
